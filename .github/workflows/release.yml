name: Release v1.0.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          jq empty manifest.webmanifest
      - name: Package
        run: zip -9 focuslane-v1.0.0.zip README.md app.js icon.svg index.html manifest.webmanifest styles.css sw.js
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 focuslane-v1.0.0.zip --title 'FocusLane v1.0.0' --notes 'First stable release of the calm, offline focus timer PWA.'
